name: test, lint & deploy

on:
  push:
  pull_request:
  # Set workflow_dispatch to enable triggering the workflow in the web UI.
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}:${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    timeout-minutes: 45

    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends \
            build-essential ca-certificates coreutils curl gcc git jq \
            make shellcheck

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          sudo ./bats-core/install.sh /usr/local
          rm -rf bats-core

      - name: Disable git config safety checks for this repository
        run: |
          git config --global --add safe.directory "$(pwd)"

      - name: Install shfmt
        env:
          VERSION: 3.13.1
          URL: https://github.com/mvdan/sh/releases/download
        run: |
          curl -o shfmt --location \
            "${URL}/v${VERSION}/shfmt_v${VERSION}_linux_amd64"
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Install rumdl
        env:
          VERSION: "0.2.79"
          URL: https://github.com/rvben/rumdl/releases/download
        run: |
          curl -sSfLo - \
            "${URL}/v${VERSION}/rumdl-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xvzf -
          sudo mv rumdl /usr/local/bin/rumdl

      - name: Install mdslw
        run: |
          curl -sSfL -o mdslw "${BASE_URL}/${MDSLW_VERSION}/mdslw_x86_64-unknown-linux-musl"
          chmod +x mdslw
          sudo mv mdslw /usr/local/bin
        env:
          MDSLW_VERSION: 0.18.0
          BASE_URL: "https://github.com/razziel89/mdslw/releases/download"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go/go.mod"
          cache: true

      - name: Build Package
        run: make build

      - name: Test Package
        run: make test

      - name: Lint Package
        run: make lint

      - name: Test Supported Bash Versions
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        run: make test-bash-versions

      - name: Build Package For Tagged Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: make build
        env:
          SHELLMOCK_FORCE_EXACT_TAG_RELEASE: 1

      - name: Publish package on GH (only tags)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          files: shellmock.bash
